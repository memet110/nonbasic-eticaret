<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Starry Night Hero — Swirl Demo</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0e17; overflow:hidden; }
  #hero { position:relative; width:100%; height:100vh; cursor:none; }
  canvas { display:block; width:100%; height:100%; }

  .overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; pointer-events:none;
    background:linear-gradient(180deg, rgba(10,14,23,0.15) 0%, rgba(10,14,23,0.05) 40%, rgba(10,14,23,0.55) 100%);
  }
  .eyebrow {
    font-family: 'Georgia', serif; letter-spacing:0.35em; text-transform:uppercase;
    font-size:12px; color:#e9dfc4; opacity:0.85; margin-bottom:18px;
  }
  h1 {
    font-family: 'Georgia', 'Times New Roman', serif; font-weight:400;
    font-size:clamp(2.4rem, 7vw, 5.5rem); color:#f4efe0; margin:0;
    text-shadow: 0 2px 30px rgba(0,0,0,0.45);
    letter-spacing:0.01em;
  }
  .sub {
    font-family: -apple-system, sans-serif; font-size:15px; color:#cfd6e6;
    margin-top:22px; max-width:420px; line-height:1.6; opacity:0.85;
  }

  .cursor-dot {
    position:absolute; width:10px; height:10px; border-radius:50%;
    background:rgba(244,239,224,0.9); pointer-events:none;
    transform:translate(-50%,-50%); mix-blend-mode:difference;
    transition:width 0.2s, height 0.2s;
  }

  .hint {
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    font-family:-apple-system, sans-serif; font-size:12px; color:#9aa4bd;
    letter-spacing:0.08em; pointer-events:none; opacity:0.7;
  }
</style>
</head>

// ---- Shaders ----
const vertSrc = `
  attribute vec2 aPos;
  varying vec2 vUv;
  void main() {
    vUv = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
  }
`;

// The fragment shader is where the "swirl" actually happens.
// - uCoverUv() maps screen UV to image UV using cover-fit (like CSS background-size:cover)
// - near the mouse, we ROTATE the sampling coordinate around the mouse point
//   (this is what makes it look like the paint is spinning, not just shifting)
// - a very subtle animated sine offset is layered everywhere so the sky never
//   feels fully static, echoing the painting's own brush motion
const fragSrc = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uImage;
  uniform vec2 uMouse;        // smoothed mouse position, in cover-uv space (0..1)
  uniform float uTime;
  uniform vec2 uResolution;
  uniform vec2 uImgSize;
  uniform float uHover;       // fades the effect in/out when pointer enters/leaves

  vec2 coverUv(vec2 uv) {
    float screenAspect = uResolution.x / uResolution.y;
    float imgAspect = uImgSize.x / uImgSize.y;
    vec2 scale = vec2(1.0);
    if (screenAspect > imgAspect) {
      scale.y = imgAspect / screenAspect;
    } else {
      scale.x = screenAspect / imgAspect;
    }
    return (uv - 0.5) * scale + 0.5;
  }

  // ---- 2D simplex noise (Ashima Arts) ----
  vec3 mod289(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
  vec2 mod289(vec2 x){return x - floor(x*(1.0/289.0))*289.0;}
  vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
  float snoise(vec2 v){
    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
             -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy));
    vec2 x0 = v -   i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
        + i.x + vec3(0.0, i1.x, 1.0 ));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
    vec3 g;
    g.x  = a0.x  * x0.x  + h.x  * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
  }

  // curl of the noise field = a divergence-free flow direction.
  // This is what produces stroke-like, swirling streaks instead of a single
  // uniform rotation — each point flows along its own little current.
  vec2 curl(vec2 p) {
    float e = 0.06;
    float n1 = snoise(p + vec2(0.0, e));
    float n2 = snoise(p - vec2(0.0, e));
    float n3 = snoise(p + vec2(e, 0.0));
    float n4 = snoise(p - vec2(e, 0.0));
    float dx = (n1 - n2) / (2.0 * e);
    float dy = (n3 - n4) / (2.0 * e);
    return vec2(dy, -dx);
  }

  void main() {
    vec2 uv = coverUv(vUv);
    vec2 diff = uv - uMouse;
    diff.x *= uResolution.x / uResolution.y;
    float dist = length(diff);

    // localized boost near the cursor, but the brush field itself exists everywhere
    float radius = 0.4;
    float falloff = smoothstep(radius, 0.0, dist) * uHover;

    // multi-octave curl noise = many small, elongated brush-stroke swirls
    // rather than one big circular warp. Stretching the sample coordinate
    // (the *1.6 on y) elongates each stroke, echoing the painting's motion.
    vec2 flow = vec2(0.0);
    vec2 p = vec2(uv.x * 10.0, uv.y * 10.0 * 1.6) ;
    float amp = 1.0;
    float freq = 1.0;
    for (int i = 0; i < 3; i++) {
      vec2 sample = p * freq + vec2(uTime * 0.06, -uTime * 0.04) * float(i + 1);
      flow += curl(sample) * amp;
      freq *= 2.1;
      amp *= 0.5;
    }

    // gentle everywhere (the whole sky always feels slightly alive),
    // strongly amplified near the cursor (that's where it reads as "brushed")
    float strength = mix(0.0028, 0.014, falloff);
    vec2 warped = uv + flow * strength;

    vec3 color = texture2D(uImage, warped).rgb;

    float vignette = smoothstep(0.9, 0.3, length(vUv - 0.5));
    color *= mix(0.75, 1.0, vignette);

    gl_FragColor = vec4(color, 1.0);
  }
`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(sh));
  }
  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
gl.linkProgram(prog);
gl.useProgram(prog);

// fullscreen triangle
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uMouse = gl.getUniformLocation(prog, 'uMouse');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uResolution = gl.getUniformLocation(prog, 'uResolution');
const uImgSize = gl.getUniformLocation(prog, 'uImgSize');
const uHover = gl.getUniformLocation(prog, 'uHover');

// load texture
const texture = gl.createTexture();
let imgW = 1, imgH = 1;
const img = new Image();
img.onload = () => {
  imgW = img.width; imgH = img.height;
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  render(0);
};
img.src = IMAGE_SRC;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// mouse tracking, smoothed (lerp) so the swirl trails gently instead of snapping
let targetMouse = [0.5, 0.5];
let mouse = [0.5, 0.5];
let targetHover = 0;
let hoverAmt = 0;

function setPointer(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  targetMouse = [ (clientX - rect.left) / rect.width, 1.0 - (clientY - rect.top) / rect.height ];
}
canvas.addEventListener('mousemove', e => { setPointer(e.clientX, e.clientY); targetHover = 1; });
canvas.addEventListener('mouseleave', () => { targetHover = 0; });
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if (t) { setPointer(t.clientX, t.clientY); targetHover = 1; }
}, { passive: true });
canvas.addEventListener('touchend', () => { targetHover = 0; });

const dot = document.createElement('div');
dot.className = 'cursor-dot';
document.getElementById('hero').appendChild(dot);
document.addEventListener('mousemove', e => {
  dot.style.left = e.clientX + 'px';
  dot.style.top = e.clientY + 'px';
});

const start = performance.now();
function render(now) {
  const t = (now - start) / 1000;
  mouse[0] += (targetMouse[0] - mouse[0]) * 0.06;
  mouse[1] += (targetMouse[1] - mouse[1]) * 0.06;
  hoverAmt += (targetHover - hoverAmt) * 0.08;

  gl.uniform2f(uMouse, mouse[0], mouse[1]);
  gl.uniform1f(uTime, t);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform2f(uImgSize, imgW, imgH);
  gl.uniform1f(uHover, hoverAmt);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(render);
}
</script>
</body>
</html>
